name: Sync and Translate Release Notes

permissions:
  contents: write

on:
  schedule:
    - cron: "30 * * * *"
  workflow_dispatch:

jobs:
  translate_releases:
    name: Auto-translate and archive new releases
    runs-on: ubuntu-latest
    if: github.repository == 'yeleo/world-of-claudecraft'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run release translation pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/sync_releases.mjs

      - name: Commit and push release changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/releases data/releases
          if ! git diff --staged --quiet; then
            git commit -m "docs(releases): auto-translate new upstream release notes [skip ci]"
            git push
          fi
